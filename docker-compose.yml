version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
    network_mode: "host" # Allows container to talk to host Ollama (127.0.0.1:11434)

  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    restart: always